name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev readline-common libreadline-dev libffi-dev ccache libncursesw5-dev tk-dev
          pip install --upgrade pip
          pip install buildozer cython bottle

      - name: Build APK with Buildozer
        run: |
          buildozer init
          sed -i 's/requirements = python3,kivy/requirements = python3,bottle/g' buildozer.spec
          sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/g' buildozer.spec
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meu-app-python-apk
          path: bin/*.apk
